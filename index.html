<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الكلمات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دفتر الكلمات اليومي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout */
:root{
  --bg:#0b1020;
  --bar:rgba(11,16,32,.84);
  --surface:#121a2e;
  --surface-2:#18223a;
  --line:#243050;
  --fg:#e8eefc;
  --muted:#8e9bba;
  --accent:#5ea6ff;
  --accent-ink:#06142b;
  --accent-soft:rgba(94,166,255,.14);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --overlay:rgba(4,8,18,.62);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --font-ui:'Tajawal','Bricolage Grotesque',system-ui,sans-serif;
  --font-en:'Bricolage Grotesque','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eff3fb;
  --bar:rgba(239,243,251,.88);
  --surface:#ffffff;
  --surface-2:#f2f5fc;
  --line:#d8e0f1;
  --fg:#0e1a33;
  --muted:#5b6988;
  --accent:#1c6ee0;
  --accent-ink:#ffffff;
  --accent-soft:rgba(28,110,224,.1);
  --good:#12805a;
  --good-bg:rgba(18,128,90,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(14,26,51,.38);
  --shadow:0 14px 32px rgba(20,40,90,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-ui);-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.row:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0}

/* press animation */
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
.tap{animation:press .2s ease-out}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{position:relative;height:56px;max-width:640px;margin:0 auto;padding-inline:16px;display:flex;align-items:center}
.left{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden;transition:background .2s,border-color .2s,width .3s cubic-bezier(.2,.8,.2,1),opacity .2s,margin .3s}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg,.snd svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd{color:var(--accent)}
.snd svg{width:18px;height:18px}
#btnSearch{margin-right:8px}
.bar.searching #btnSearch{background:var(--accent-soft);border-color:var(--accent)}
.bar.searching #btnTheme{width:0;opacity:0;border-width:0;pointer-events:none}
.sfield{flex:0 0 0;min-width:0;opacity:0;overflow:hidden;display:flex;align-items:center;gap:8px;pointer-events:none;transition:flex-grow .32s cubic-bezier(.2,.8,.2,1),opacity .22s}
.bar.searching .sfield{flex:1 1 0;opacity:1;pointer-events:auto}
.pill{flex:1;min-width:0;height:40px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;transition:border-color .2s}
.pill:focus-within{border-color:var(--accent)}
.pill input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--font-ui)}
.pill input::placeholder{color:var(--muted)}
.title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-weight:800;font-size:17px;letter-spacing:.2px;transition:opacity .2s}
.title b{color:var(--accent);font-family:var(--font-en);font-size:19px}
.bar.searching .title{opacity:0}
.menu-anchor{position:relative;z-index:2;flex:none;margin-left:8px}
#btnMenu{font-size:20px}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:min(268px,calc(100vw - 32px));direction:rtl;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);transform-origin:calc(100% - 20px) 0;opacity:0;visibility:hidden;transform:translateY(-12px) scale(.94);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.25,1.08),visibility 0s .28s}
.menu.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu::before{content:'';position:absolute;top:-6px;right:14px;width:11px;height:11px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu.open .mitem{animation:rise .3s both}
.menu.open .mitem:nth-child(1){animation-delay:.04s}
.menu.open .mitem:nth-child(2){animation-delay:.08s}
.menu.open .mitem:nth-child(3){animation-delay:.12s}
.menu.open .mitem:nth-child(4){animation-delay:.16s}
.mitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:11px;text-align:start;font-weight:500;font-size:15px;transition:background .15s}
.mitem:hover,.mitem:focus-visible{background:var(--surface-2)}
.mitem .e{width:26px;text-align:center;font-size:20px}

/* page */
.wrap{max-width:640px;margin:0 auto;padding:72px 16px 48px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .lat{font-family:var(--font-en)}
.tab .n{font:700 12px var(--font-en);padding:1px 8px;border-radius:99px;background:rgba(127,127,127,.22);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:16px;font-weight:800}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mini{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.mini button{height:30px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:99px;font-size:13.5px;font-weight:800;color:var(--accent);opacity:.6;transition:background .2s,opacity .2s,transform .12s}
.mini button>span{display:block;transform:translateY(1px)}
.mini button:active{transform:scale(.94)}
.mini button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
textarea{display:block;width:100%;min-height:104px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 16px/1.6 var(--font-en)}
textarea{unicode-bidi:plaintext}
textarea::placeholder{color:var(--muted)}
.ff{display:flex;flex-direction:column;gap:12px}
.ff label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ff input{display:block;width:100%;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg);font:500 16px/1.4 var(--font-ui)}
.ff input::placeholder{color:var(--muted)}
.ff input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ff textarea{min-height:76px}
.ver{text-align:center;font:600 12px var(--font-en);color:var(--muted);direction:ltr;padding:4px 0 0;opacity:.8}
.foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.hint{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--muted)}
.hint.err{color:var(--bad)}
.hint code{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;color:var(--fg)}
.save{flex:none;height:42px;padding-inline:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}

/* list */
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.item.open{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.en{flex:0 1 auto;min-width:0;max-width:46%;direction:ltr;unicode-bidi:isolate;font:700 17px var(--font-en);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}
.cat{flex:none;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .detail{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0}
.detail-pad{display:flex;flex-direction:column;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-word{direction:ltr;unicode-bidi:isolate;font:800 24px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere;min-width:0}
.d-play{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:36px;padding-inline:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:2px}
.val{overflow-wrap:anywhere}
.val.note{padding:10px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-en)}
.nl{white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;line-height:1.8}
.nl.sp{height:.6em}
.val.ph{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-en)}
.val.none{color:var(--muted)}
.nedit{display:flex;flex-direction:column;gap:8px}
.ne-ph{width:100%;height:42px;padding-inline:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-en)}
.ne-ph::placeholder{color:var(--muted)}
.ne-ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.sm{height:38px;padding-inline:16px}
.menu.open .mitem:nth-child(5){animation-delay:.2s}
.menu.open .mitem:nth-child(6){animation-delay:.24s}
.menu.open .mitem:nth-child(7){animation-delay:.28s}
.menu.open .mitem:nth-child(8){animation-delay:.32s}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#ffffff;color:#1f1f1f;border:1px solid #dadce0}
.gbtn svg{width:20px;height:20px;flex:none}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html{overscroll-behavior:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.exnote{font-size:12px;color:var(--muted)}
.del{align-self:flex-start;height:36px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);color:var(--bad);font-size:13px;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.catedit{display:flex;flex-direction:column;align-items:flex-start}
.catopts{display:flex;flex-wrap:wrap;gap:6px}
.copt{height:34px;padding-inline:14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700}
.copt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.m-cat{color:var(--fg);font-weight:700}

#btnSearch svg{grid-area:1/1;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
#btnSearch .i-x{opacity:0;transform:rotate(-90deg) scale(.5)}
.bar.searching #btnSearch .i-search{opacity:0;transform:rotate(90deg) scale(.5)}
.bar.searching #btnSearch .i-x{opacity:1;transform:none}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translate(-50%,102%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:18px;font-weight:800}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}

/* =========================================================
   تنسيقات الإحصائيات المتقدمة (Advanced Stats UI)
   ========================================================= */
.st-container { display: flex; flex-direction: column; gap: 16px; padding: 4px 0; }

.st-streak-card {
  background: linear-gradient(135deg, rgba(94, 166, 255, 0.15), rgba(62, 207, 142, 0.15));
  border: 1px solid var(--accent);
  border-radius: 16px; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.st-streak-info h3 { margin: 0 0 4px; font-size: 15px; font-weight: 800; color: var(--fg); }
.st-streak-info p { margin: 0; font-size: 13px; color: var(--muted); }
.st-streak-badge {
  background: var(--accent); color: var(--accent-ink);
  font: 800 18px var(--font-en); padding: 8px 14px; border-radius: 12px;
}

.st-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.st-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 8px; text-align: center;
  display: flex; flex-direction: column; gap: 4px; transition: transform 0.2s;
}
.st-card:hover { transform: translateY(-2px); }
.st-num { font: 800 24px/1 var(--font-en); color: var(--accent); }
.st-lbl { font-size: 11px; color: var(--muted); font-weight: 700; }

.st-section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.st-chart-box { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 130px; align-items: flex-end; padding-top: 10px; }
.st-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 6px; }
.st-val { font: 700 11px var(--font-en); color: var(--accent); min-height: 14px; }
.st-bar-wrap { width: 100%; max-width: 24px; height: 80px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
.st-bar { width: 100%; background: var(--accent); border-radius: 8px; transition: height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
.st-col.is-today .st-bar { background: var(--good); }
.st-day { font-size: 11px; color: var(--muted); font-weight: 700; }

.st-cat-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.st-cat-item { display: flex; flex-direction: column; gap: 4px; }
.st-cat-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.st-cat-count { font: 700 12px var(--font-en); color: var(--muted); }
.st-cat-progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.st-cat-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; }

/* =========================================================
   تنسيقات خريطة الكلمات التفاعلية (Interactive Word Map UI)
   ========================================================= */
.map-container { display: flex; flex-direction: column; gap: 14px; }

.map-controls { display: flex; flex-direction: column; gap: 10px; }
.map-search-input input {
  width: 100%; height: 42px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 14px;
  color: var(--fg); font: 500 14px var(--font-ui); outline: none;
}
.map-search-input input:focus { border-color: var(--accent); }

.map-tabs-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.map-tabs-bar::-webkit-scrollbar { display: none; }
.map-tab {
  white-space: nowrap; padding: 6px 14px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted); transition: all 0.2s;
}
.map-tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.map-grid { display: flex; flex-direction: column; gap: 12px; }
.map-group-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.map-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.map-group-title { font-size: 14px; font-weight: 800; color: var(--fg); }
.map-group-badge { font: 700 11px var(--font-en); background: var(--surface-2); padding: 2px 8px; border-radius: 99px; color: var(--muted); }

.map-chips-wrapper { display: flex; flex-wrap: wrap; gap: 8px; }
.map-chip {
  display: inline-flex; flex-direction: column; align-items: flex-start;
  padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); cursor: pointer; transition: all 0.2s cubic-bezier(0.2,0.8,0.2,1);
}
.map-chip:hover { border-color: var(--accent); transform: scale(1.03); background: var(--accent-soft); }
.map-chip.chip-idiom { border-color: rgba(255, 107, 122, 0.4); }
.map-chip.chip-idiom:hover { border-color: var(--bad); background: var(--bad-bg); }

.chip-txt { font: 700 14px var(--font-en); color: var(--fg); }
.chip-ph { font: 500 10px var(--font-en); color: var(--muted); margin-top: -2px; }

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:opacity .2s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<body>
<div id="app" dir="rtl">
  <header class="bar" id="bar">
    <div class="bar-in" dir="ltr">
      <div class="left">
        <button class="ibtn" id="btnSearch" aria-label="بحث" aria-expanded="false"><svg class="i-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><svg class="i-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="ibtn" id="btnTheme" aria-label="تبديل الوضع الداكن والفاتح"></button>
        <div class="sfield" id="sfield" inert>
          <div class="pill"><input id="q" type="text" dir="auto" autocomplete="off" enterkeyhint="search" placeholder="ابحث في دفترك" aria-label="بحث في الكلمات"></div>
        </div>
      </div>
      <div class="title"><b>Enotes</b></div>
      <div class="menu-anchor">

  get:function(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:d},

var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var SPK='<svg viewBox="-0.75 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
var CATS=['اسم','فعل','صفة','ضمير','حرف جر','ظرف/حال','روابط'];
var ICATS=['رسمية','غير رسمية'];
function catsFor(t){return t==='idiom'?ICATS:CATS}
var LANGS={'en-US':'أمريكية','en-GB':'بريطانية','en-AU':'أسترالية'};

/* ---------- data ---------- */
var seed=[
  ['serendipity','صدفة سعيدة','اسم','Finding that old letter was pure serendipity.','word','/ˌserənˈdɪpəti/'],
  ['resilient','مرن وقادر على التعافي','صفة','Children are often more resilient than we expect.','word','/rɪˈzɪliənt/'],
  ['procrastinate','يماطل ويؤجّل','فعل','Stop procrastinating and start the report.','word','/prəˈkræstɪneɪt/'],
  ['meticulous','دقيق جدًا في التفاصيل','صفة','She is meticulous about her notes.','word','/məˈtɪkjələs/'],
  ['ubiquitous','منتشر في كل مكان','صفة','Smartphones are ubiquitous now.','word','/juːˈbɪkwɪtəs/'],
  ['nevertheless','مع ذلك','ظرف/حال','It was raining. Nevertheless, we went out.','word','/ˌnevəðəˈles/'],
  ['reconcile','يوفّق بين طرفين متعارضين ويُصلح بينهما حتى يعود الوئام كما كان','فعل','They finally reconciled after years apart.','word','/ˈrekənsaɪl/'],
  ['break the ice','كسر الجمود في بداية اللقاء','غير رسمية','A joke is a good way to break the ice.','idiom'],
  ['piece of cake','شيء سهل جدًا','غير رسمية','The exam was a piece of cake.','idiom'],
  ['under the weather','متوعك قليلًا','غير رسمية','I am feeling a bit under the weather.','idiom'],
  ['once in a blue moon','نادرًا جدًا','غير رسمية','We meet once in a blue moon.','idiom'],
  ['hit the nail on the head','أصاب كبد الحقيقة','غير رسمية','You hit the nail on the head with that answer.','idiom']
];
var t0=Date.now();
function legacyImport(){
  var LAT=/[A-Za-z]/,ARB=/[؀-ۿ]/,seq=0,found=[];
  function mapList(arr,keyName){
    var out=[],idiomKey=/idiom/i.test(keyName),base=Date.now();
    arr.forEach(function(o,idx){
      if(!o||typeof o!=='object'||Array.isArray(o))return;
      var strs=[];
      Object.keys(o).forEach(function(f){if(typeof o[f]==='string'&&o[f].trim())strs.push([f.toLowerCase(),o[f].trim()])});
      function pick(names,test,fallback){
        for(var n=0;n<names.length;n++)for(var j=0;j<strs.length;j++)if(strs[j][0]===names[n]&&(!test||test(strs[j][1])))return strs[j][1];
        if(fallback)for(var q=0;q<strs.length;q++)if(test(strs[q][1]))return strs[q][1];
        return '';
      }
      var en=pick(['en','english','word','term','eng','front','text','name'],function(x){return LAT.test(x)&&!ARB.test(x)},true);
      var ar=pick(['ar','arabic','meaning','mean','translation','def','definition','back'],function(x){return ARB.test(x)},true);
      if(!en||!ar)return;
      var kind=String(o.type||o.kind||o.tab||o.section||'');
      var cat=o.cat!==undefined?o.cat:(o.category!==undefined?o.category:(o.pos!==undefined?o.pos:o['تصنيف']));
      if(Array.isArray(cat))cat=cat[0];
      if(typeof cat!=='string'||!cat.trim()||/^(word|words|idiom|idioms)$/i.test(cat.trim()))cat='عام';
      var notes=pick(['notes','note','example','examples','ex','sentence','desc','description','details'],null,false);
      var ph=pick(['ph','phonetic','phonetics','ipa','pron','pronunciation'],null,false);
      var ts=NaN;
      ['ts','time','created','createdat','added','addedat','date','timestamp'].some(function(f){
        var key=Object.keys(o).filter(function(k){return k.toLowerCase()===f})[0];
        if(key===undefined)return false;
        var v=o[key];
        if(typeof v==='number'&&v>1e11){ts=v;return true}
        if(typeof v==='string'&&!isNaN(Date.parse(v))){ts=Date.parse(v);return true}
        return false;
      });
      if(isNaN(ts))ts=base-idx*1000;
      out.push({id:'m'+(seq++).toString(36)+base.toString(36),en:en,ar:ar,cat:cat.trim(),notes:notes,ph:ph,type:(idiomKey||/idiom/i.test(kind))?'idiom':'word',ts:ts,ex:false});
    });
    return out;
  }
  try{
    for(var k=0;k<localStorage.length;k++){
      var key=localStorage.key(k);
      if(!key||key.indexOf('wb.')===0)continue;
      var v;
      try{v=JSON.parse(localStorage.getItem(key))}catch(e){continue}
      if(Array.isArray(v))found=found.concat(mapList(v,key));
      else if(v&&typeof v==='object')Object.keys(v).forEach(function(kk){if(Array.isArray(v[kk]))found=found.concat(mapList(v[kk],key+'.'+kk))});
    }
  }catch(e){}
  var seen={};
  return found.filter(function(i){var d=i.type+'|'+i.en.toLowerCase();if(seen[d])return false;seen[d]=1;return true});
}
function seedItems(){return seed.map(function(s,i){return {id:'s'+i,en:s[0],ar:s[1],cat:s[2],notes:s[3],type:s[4],ph:s[5]||'',ts:t0-i*3600000,ex:true}})}
var items=store.get('wb.items',null),imported=0;
if(!Array.isArray(items)){
  try{var rawOld=localStorage.getItem('wb.items');if(rawOld)localStorage.setItem('wb.items.unreadable.'+Date.now(),rawOld)}catch(e){}
}
if(!Array.isArray(items)){
  var legacy=legacyImport();
  if(legacy.length){items=legacy;imported=legacy.length}
  else items=seedItems();
  store.set('wb.items',items);
}
items.forEach(function(i){if(i.ex&&i.type==='idiom'&&i.cat==='تعبير')i.cat='غير رسمية'});
var pref=store.get('wb.pref',{accent:'en-US',rate:1});
items.forEach(function(i){if(i.cat==='ظرف')i.cat='ظرف/حال'});
var tombs=store.get('wb.tombs',{}),dirty=store.get('wb.dirty',{});

var tab='words', query='', current=null, quiz=null, acSel='tomato', fc=null;

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){return new Date(ts).toISOString().slice(0,10)}}

var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1900)}

function copyText(t){
  var done=function(){toast('تم النسخ')};
  var fb=function(){
    try{
      var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      ok?done():toast('تعذّر النسخ');
    }catch(e){toast('تعذّر النسخ')}
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}catch(e){fb()}
}

function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)){toast('هذا الجهاز لا يدعم النطق');return}
    var ss=window.speechSynthesis;ss.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang||pref.accent;
    var vs=ss.getVoices()||[];
    var norm=function(v){return v.lang.replace('_','-').toLowerCase()};
    var v=vs.filter(function(x){return norm(x)===u.lang.toLowerCase()})[0]||vs.filter(function(x){return norm(x).indexOf('en')===0})[0];
    if(v)u.voice=v;
    u.rate=pref.rate||1;
    ss.speak(u);
  }catch(e){toast('تعذّر تشغيل الصوت')}
}

/* ---------- list ---------- */
var DIA=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/;
function normMap(str){
  var out='',map=[];
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i);
    if(DIA.test(c))continue;
    c=c.toLowerCase();
    if('\u0623\u0625\u0622\u0671'.indexOf(c)>-1)c='\u0627';
    else if(c==='\u0649')c='\u064A';
    for(var k=0;k<c.length;k++){out+=c.charAt(k);map.push(i)}
  }
  return {s:out,map:map};
}
function norm(str){return normMap(String(str)).s}
function hl(text){
  text=String(text);
  if(!query)return esc(text);
  var nm=normMap(text),ranges=[],from=0,idx;
  while((idx=nm.s.indexOf(query,from))>-1){
    var st=nm.map[idx],en=nm.map[idx+query.length-1]+1;
    while(en<text.length&&DIA.test(text.charAt(en)))en++;
    ranges.push([st,en]);from=idx+query.length;
  }
  if(!ranges.length)return esc(text);
  var out='',p=0;
  ranges.forEach(function(r){
    if(r[0]<p)r[0]=p;
    if(r[1]<=r[0])return;
    out+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1];
  });
  return out+esc(text.slice(p));
}
function noteHTML(text,h){
  return String(text).replace(/\r/g,'').split('\n').map(function(l){
    return l.trim()?'<div class="nl" dir="auto">'+(h?hl(l):esc(l))+'</div>':'<div class="nl sp"></div>';
  }).join('');
}
function rowHTML(i){
  var note=i.notes?'<div><div class="lbl">ملاحظة أو مثال</div><div class="val note">'+noteHTML(i.notes,true)+'</div></div>':'';

  return '<li class="item" data-id="'+i.id+'">'+
    '<div class="row" role="button" tabindex="0" aria-expanded="false">'+
      '<span class="en">'+hl(i.en)+'</span>'+
      '<span class="ar">'+hl(i.ar)+'</span>'+
      '<button class="snd" data-act="say" aria-label="نطق '+esc(i.en)+'">'+SPK+'</button>'+
      '<span class="cat">'+hl(i.cat)+'</span>'+
    '</div>'+
    '<div class="detail"><div class="detail-in"><div class="detail-pad">'+
      '<div class="d-top"><span class="d-word">'+hl(i.en)+'</span></div>'+
      '<div><div class="lbl">الرسم الصوتي</div>'+(i.ph?'<div class="val ph">'+hl(i.ph)+'</div>':'<div class="val none">غير مزوّد</div>')+'</div>'+
      (i.ar?'<div><div class="lbl">المعنى</div><div class="val">'+hl(i.ar)+'</div></div>':'')+
      note+
      '<div class="meta"><span>التصنيف: <span class="m-cat">'+esc(i.cat)+'</span></span><span>أُضيفت: '+fmtDate(i.ts)+'</span></div>'+
      '<div class="acts"><button class="pbtn" data-act="editcat" aria-expanded="false">تعديل التصنيف</button><button class="pbtn" data-act="editnote" aria-expanded="false">تعديل الملاحظة</button><button class="pbtn" data-act="copy">نسخ</button><button class="del" data-act="del">حذف</button></div>'+
      '<div class="catopts" hidden>'+
        catsFor(i.type).map(function(c){return '<button class="copt" data-act="setcat" data-v="'+esc(c)+'" aria-pressed="'+(i.cat===c)+'">'+esc(c)+'</button>'}).join('')+
      '</div>'+
      '<div class="nedit" hidden>'+
        '<textarea class="ne-text" dir="auto" aria-label="تعديل الملاحظة" placeholder="write your thoughts here...."></textarea>'+
        '<input class="ne-ph" type="text" dir="ltr" aria-label="الرسم الصوتي" placeholder="الرسم الصوتي (اختياري)، مثل /ɪnˈhæbɪtɪd/">'+
        '<div class="acts"><button class="save sm" data-act="savenote">حفظ التعديل</button><button class="pbtn" data-act="cancelnote">إلغاء</button></div>'+
      '</div>'+
      ex+
    '</div></div></div></li>';
}
function render(){
  var type=tab==='words'?'word':'idiom';
  var nw=items.filter(function(i){return i.type==='word'}).length;
  $('#nWords').textContent=nw;$('#nIdioms').textContent=items.length-nw;
  var all=items.filter(function(i){return i.type===type}).sort(function(a,b){return b.ts-a.ts});
  var shown=query?all.filter(function(i){return norm(i.en+' '+i.ar+' '+i.cat+' '+i.notes+' '+(i.ph||'')).indexOf(query)>-1}):all;
  var list=$('#list');
  if(!shown.length){
    list.innerHTML='<li class="empty">'+(query?'لا توجد نتائج لـ «'+esc(qIn.value.trim())+'»':(tab==='words'?'لا توجد كلمات بعد. اكتب أول كلمة في الورقة الجديدة.':'لا توجد تعابير بعد. اكتب أول تعبير في الورقة الجديدة.'))+'</li>';
    return;
  }
  list.innerHTML=shown.map(rowHTML).join('');
}
function toggleItem(li,force){

$('#list').addEventListener('click',function(e){

  var it=items.filter(function(x){return x.id===li.dataset.id})[0];if(!it)return;

var AR=/[؀-ۿ]/,LAT=/[A-Za-z]/;
function trimSep(x){return x.replace(/^[\s\-–—=:|،,]+|[\s\-–—=:|،,]+$/g,'')}
var FLAG=/\uD83C[\uDDE6-\uDDFF]\uD83C[\uDDE6-\uDDFF]/g;
var IPA=/[æðŋœɐ-˿θᴀ-ᶿ]/;
var PH_SRC='(\\/[^\\/\\n\\u0600-\\u06FF]{2,40}\\/|\\[[^\\]\\n\\u0600-\\u06FF]{2,40}\\])';
function findPh(str){
  var re=new RegExp(PH_SRC,'g'),m;
  while((m=re.exec(str))){if(IPA.test(m[1]))return m[1]}
  return '';
}
function cleanMeaning(x){return x.replace(/^(تعني|معناها|معنى|المعنى|يعني)\s*[:：\-–]\s*/,'').replace(/[.。]+$/,'').trim()}
function parseFree(text){
  var lines=text.replace(/\r/g,'').split('\n').map(function(x){return x.replace(/\s+$/,'')});
  var first=(lines.shift()||'').trim();
  var ph=findPh(first);
  if(ph)first=first.replace(ph,' ');
  first=first.replace(FLAG,' ').replace(/\s+/g,' ').trim();
  var en=first,ar='',raw='',ia=first.search(AR),il=first.search(LAT);
  if(ia>-1&&il>-1){
    if(il<ia){en=first.slice(0,ia);ar=first.slice(ia)}else{ar=first.slice(0,il);en=first.slice(il)}
    en=trimSep(en);ar=trimSep(ar);
  }else{
    for(var k=0;k<lines.length;k++)if(lines[k].trim()){raw=lines[k].trim();break}
    if(raw)ar=cleanMeaning(raw);
  }
  var notes=lines.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
  if(raw&&notes.trim()===raw)notes='';
  if(!ph&&en){
    var m2=new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'+PH_SRC).exec(text);
    if(m2&&IPA.test(m2[1]))ph=m2[1];
  }
  return {en:en,ar:ar,ph:ph,notes:notes};
}

/* =========================================================
   1. واجهة الإحصائيات المتقدمة (Stats View)
   ========================================================= */
function statsView() {
  var words = items.filter(function(i){ return i.type === 'word' }).length;
  var idioms = items.length - words;
  var real = items.filter(function(i){ return !i.ex });
  var totalCount = items.length || 1;

  var weekAgo = Date.now() - 7 * 86400000;
  var weekCount = real.filter(function(i){ return i.ts >= weekAgo }).length;
  var streakGoal = 10;
  var progressPct = Math.min(100, Math.round((weekCount / streakGoal) * 100));

  var days = [];
  for (var k = 6; k >= 0; k--) {
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - k);
    var s = d.getTime(), e = s + 86400000;
    var count = real.filter(function(i){ return i.ts >= s && i.ts < e }).length;
    days.push({ d: d, n: count });
  }
  var maxVal = Math.max.apply(null, days.map(function(x){ return x.n }).concat([1]));

  var colsHtml = days.map(function(x) {
    var heightPct = Math.max(8, Math.round((x.n / maxVal) * 100));
    var isToday = new Date().toDateString() === x.d.toDateString();
    return '<div class="st-col ' + (isToday ? 'is-today' : '') + '">' +
             '<span class="st-val">' + (x.n > 0 ? x.n : '') + '</span>' +
             '<div class="st-bar-wrap"><div class="st-bar" style="height:' + heightPct + '%"></div></div>' +
             '<span class="st-day">' + esc(fmtDay(x.d)) + '</span>' +
           '</div>';
  }).join('');

  var catCounts = {};
  items.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat] || 0) + 1 });
  var catList = Object.keys(catCounts).map(function(c){ return [c, catCounts[c]] }).sort(function(a,b){ return b[1] - a[1] });
  
  var catHtml = catList.map(function(c) {
    var pct = Math.round((c[1] / totalCount) * 100);
    return '<div class="st-cat-item">' +
             '<div class="st-cat-head">' +
               '<span class="st-cat-name">' + esc(c[0]) + '</span>' +
               '<span class="st-cat-count">' + c[1] + ' <small>(' + pct + '%)</small></span>' +
             '</div>' +
             '<div class="st-cat-progress"><div class="st-cat-fill" style="width:' + pct + '%"></div></div>' +
           '</div>';
  }).join('') || '<div class="exnote">لا توجد بيانات تصنيف بعد.</div>';

  return '<div class="st-container">' +
    '<div class="st-streak-card">' +
      '<div class="st-streak-info">' +
        '<h3>🔥 مستوى النشاط الأسبوعي</h3>' +
        '<p>أضفت <b>' + weekCount + '</b> مفردات جديدة هذا الأسبوع من هدفك (' + streakGoal + ').</p>' +
      '</div>' +
      '<div class="st-streak-badge">' + progressPct + '%</div>' +
    '</div>' +
    '<div class="st-grid-3">' +
      '<div class="st-card"><span class="st-num">' + words + '</span><span class="st-lbl">كلمة إنجليزية</span></div>' +
      '<div class="st-card"><span class="st-num">' + idioms + '</span><span class="st-lbl">تعبير شائعة</span></div>' +
      '<div class="st-card"><span class="st-num">' + real.length + '</span><span class="st-lbl">حصيلتك الشخصية</span></div>' +
    '</div>' +
    '<div class="st-section">' +
      '<div class="sec-t">📊 المضافة خلال آخر 7 أيام</div>' +
      '<div class="st-chart-box">' + colsHtml + '</div>' +
    '</div>' +
    '<div class="st-section">' +
      '<div class="sec-t">🏷️ توزيع الكلمات حسب التصنيف</div>' +
      '<div class="st-cat-list">' + catHtml + '</div>' +
    '</div>' +
  '</div>';
}

function mapView() {
  if (!items.length) return '<div class="empty">أضف كلمات لتظهر خريطتها التفاعلية هنا.</div>';

  var groups = {};
  items.forEach(function(i) { (groups[i.cat] = groups[i.cat] || []).push(i); });
  var catKeys = Object.keys(groups).sort(function(a, b) { return groups[b].length - groups[a].length; });

  var tabsHtml = '<button class="map-tab active" data-map-cat="all">الكل (' + items.length + ')</button>' +
    catKeys.map(function(c) {
      return '<button class="map-tab" data-map-cat="' + esc(c) + '">' + esc(c) + ' (' + groups[c].length + ')</button>';
    }).join('');

  var contentHtml = catKeys.map(function(c) {
    var wordsInCat = groups[c];
    var chips = wordsInCat.map(function(i) {
      var typeClass = i.type === 'idiom' ? 'chip-idiom' : 'chip-word';
      return '<button class="map-chip ' + typeClass + '" data-act="chip" data-id="' + i.id + '" title="' + esc(i.ar || '') + '">' +
               '<span class="chip-txt">' + esc(i.en) + '</span>' +

             '</button>';

    return '<div class="map-group-card" data-cat-group="' + esc(c) + '">' +
             '<div class="map-group-header">' +
               '<span class="map-group-title">📁 ' + esc(c) + '</span>' +
               '<span class="map-group-badge">' + wordsInCat.length + ' مفردة</span>' +
             '</div>' +
             '<div class="map-chips-wrapper">' + chips + '</div>' +
           '</div>';
  }).join('');

  return '<div class="map-container">' +
    '<div class="map-controls">' +
      '<div class="map-search-input">' +
        '<input type="text" id="mapSearch" placeholder="🔍 فلترة الخريطة باسم الكلمة..." autocomplete="off">' +
      '</div>' +
      '<div class="map-tabs-bar">' + tabsHtml + '</div>' +
    '</div>' +
    '<div class="map-grid" id="mapGrid">' + contentHtml + '</div>' +
  '</div>';
}

function importData(text){
  var d;try{d=JSON.parse(text)}catch(e){toast('الملف غير صالح');return}
  var list=Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:null);
  if(!list){toast('لم أجد كلمات في هذا الملف');return}
  var seen={};items.forEach(function(i){seen[i.type+'|'+i.en.toLowerCase()]=1});
  var used={};items.forEach(function(i){used[i.id]=1});
  var added=0;
  list.forEach(function(o,k){
    if(!o||typeof o.en!=='string'||!o.en.trim())return;
    var type=o.type==='idiom'?'idiom':'word',dk=type+'|'+o.en.trim().toLowerCase();
    if(seen[dk])return;
    seen[dk]=1;
    var id=(typeof o.id==='string'&&/^[\w-]{1,40}$/.test(o.id)&&!used[o.id])?o.id:'i'+Date.now().toString(36)+k;
    used[id]=1;
    items.push({id:id,en:o.en.trim(),ar:typeof o.ar==='string'?o.ar:'',cat:typeof o.cat==='string'&&o.cat?o.cat:'عام',notes:typeof o.notes==='string'?o.notes:'',ph:typeof o.ph==='string'?o.ph:'',type:type,ts:typeof o.ts==='number'?o.ts:Date.now(),upd:Date.now(),ex:false});
    dirty[id]=1;added++;
  });
  if(added){persist();render();syncSoon()}
  toast(added?'تم استرجاع '+added+' من الكلمات':'كل كلمات النسخة موجودة عندك مسبقًا');
  if(current==='backup')renderSheet();
}

  if(!r||r.error){cloud.err='تعذّر تسجيل الدخول.';refreshAccount();return;}
  var tok=r.access_token,exp=Date.now()+Math.max(60,(r.expires_in||3600)-120)*1000;
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(function(x){
    if(!x.ok)throw new Error('userinfo');return x.json();
  }).then(function(u){
    cloud.user={sub:u.sub,email:u.email||'',name:u.name||''};store.set('wb.drive',cloud.user);
    cloud.token=tok;cloud.exp=exp;cloud.needAuth=false;cloud.status='in';cloud.err='';
    refreshAccount();syncNow();
  }).catch(function(){cloud.err='تعذّر قراءة المعلومات.';refreshAccount()});
}
function signIn(){cloud.err='';requestToken(true)}

function syncSoon(){clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
function syncNow(){ return Promise.resolve(); } // مبسط للعمل المحلي

function accountView(){
  var err=cloud.err?'<div class="hint err">'+esc(cloud.err)+'</div>':'';
  if(cloud.status==='out')return '<div class="group"><div class="exnote">سجّل الدخول بحساب Google لتُحفظ كلماتك تلقائيًا.</div></div>'+err+
    '<button class="btn-main gbtn" data-act="signin">'+G_LOGO+'تسجيل الدخول بحساب Google</button>';
  var u=cloud.user;
  return '<div class="group"><div style="font-weight:800">'+esc(u.name||'حسابك')+'</div><div class="exnote" dir="ltr">'+esc(u.email||'')+'</div></div>'+
    '<div class="seg"><button class="sbtn" data-act="signout">تسجيل الخروج</button></div>';
}

function newFc(){return {order:items.slice().sort(function(a,b){return b.ts-a.ts}).map(function(i){return i.id}),i:0,flipped:false}}
function fcItem(){return items.filter(function(x){return x.id===fc.order[fc.i]})[0]}
function cardsView(){
  if(!fc.order.length)return '<div class="empty">أضف كلمات لتظهر بطاقات المراجعة هنا.</div>';
  return '<div class="fc-meta"><span id="fcCount"></span></div>'+
    '<div class="fc-scene" id="fcScene"><div class="fc-card" id="fcCard" data-act="fcflip" role="button" tabindex="0">'+
      '<div class="fc-face fc-front"><div class="fc-c"><div class="fc-word" id="fcWord"></div></div></div>'+
      '<div class="fc-face fc-back"><div class="fc-c"><div class="fc-ar" id="fcAr"></div></div></div>'+
    '</div></div>';
}
function fcUpdate(){
  if(!fc||!$('#fcCard'))return;
  var it=fcItem();if(!it)return;
  $('#fcWord').textContent=it.en;
  $('#fcAr').textContent=it.ar||'لا يوجد معنى';
}

function quizBody(){
  if(qItems().length<2)return '<div class="empty">أضف كلمتين على الأقل لتبدأ الاختبار.</div>';
  return '<div class="result">اختبار المفردات جاهز.</div>';
}

function accentView(){
  return '<div><div class="sec-t">إعدادات النطق والتسجيل</div></div>';
}

/* الأحداث العامة وإدارة الكليكات */
sbody.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='chip')goTo(t.dataset.id);
  else if(a==='signin')signIn();
  else if(a==='export'){
    try{
      var blob=new Blob([backupJSON()],{type:'application/json'});
      var url=URL.createObjectURL(blob),dl=document.createElement('a');
      dl.href=url;dl.download='words-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(dl);dl.click();document.body.removeChild(dl);
      toast('جارٍ تنزيل النسخة');
    }catch(err){toast('تعذّر التنزيل')}
  }
  else if(a==='copyjson'){copyText(backupJSON())}
  else if(a==='import'){var it2=$('#impText');if(it2&&it2.value.trim())importData(it2.value);else toast('الصق البيانات أولًا')}
});

document.addEventListener('click', function(e) {
  var tabBtn = e.target.closest('.map-tab');
  if (tabBtn) {
    var cat = tabBtn.dataset.mapCat;
    document.querySelectorAll('.map-tab').forEach(function(b){ b.classList.remove('active'); });
    tabBtn.classList.add('active');
    document.querySelectorAll('.map-group-card').forEach(function(card) {
      if (cat === 'all' || card.dataset.catGroup === cat) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  }
});

document.addEventListener('input', function(e) {
  if (e.target.id === 'mapSearch') {
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.map-chip').forEach(function(chip) {
      var txt = chip.querySelector('.chip-txt').textContent.toLowerCase();
      if (!q || txt.indexOf(q) > -1) {
        chip.style.display = 'inline-flex';
      } else {
        chip.style.display = 'none';
      }
    });
  }
});

setPanel(store.get('wb.panel','free')==='form'?'form':'free');
setTab('words');
})();
</script>
