<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>دفتر الكلمات اليومي - Enotes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#0b1020; --bar:rgba(11,16,32,.84); --surface:#121a2e; --surface-2:#18223a;
  --line:#243050; --fg:#e8eefc; --muted:#8e9bba; --accent:#5ea6ff; --accent-ink:#06142b;
  --accent-soft:rgba(94,166,255,.14); --good:#3ecf8e; --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a; --bad-bg:rgba(255,107,122,.14); --gold:#ffd700;
  --font-ui:'Tajawal',system-ui,sans-serif; --font-en:'Bricolage Grotesque',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eff3fb; --bar:rgba(239,243,251,.88); --surface:#ffffff; --surface-2:#f2f5fc;
  --line:#d8e0f1; --fg:#0e1a33; --muted:#5b6988; --accent:#1c6ee0; --accent-ink:#ffffff;
  --accent-soft:rgba(28,110,224,.1); --good:#12805a; --bad:#c9304a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-ui);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{height:56px;max-width:640px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.title{font-weight:800;font-size:18px;color:var(--accent);font-family:var(--font-en)}

/* Layout */
.wrap{max-width:640px;margin:0 auto;padding:72px 16px 48px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
textarea{display:block;width:100%;min-height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font-family:var(--font-en)}
.save{height:42px;padding:0 24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;margin-top:10px;width:100%}

#list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.en{font:700 17px var(--font-en);color:var(--accent)}
.ar{font-size:14px;color:var(--fg)}

/* Menu Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6)}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(640px,100%);max-height:88vh;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;transform:translate(-50%,0);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

/* Advanced Stats UI */
.st-streak-card{background:linear-gradient(135deg, rgba(94, 166, 255, 0.15), rgba(62, 207, 142, 0.15));border:1px solid var(--accent);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between}
.st-streak-info h3{margin:0 0 4px;font-size:15px;font-weight:800}
.st-streak-info p{margin:0;font-size:12px;color:var(--muted)}
.st-streak-badge{background:var(--accent);color:var(--accent-ink);font:800 18px var(--font-en);padding:6px 12px;border-radius:12px}

.st-level-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.st-level-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.st-level-bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.st-level-fill{height:100%;background:linear-gradient(90deg, var(--accent), var(--good));border-radius:99px;transition:width .4s}

.st-badges-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px}
.badge-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0.4}
.badge-item.unlocked{opacity:1;border-color:var(--gold)}
.badge-icon{font-size:24px}
.badge-title{font-size:11px;font-weight:700}

.st-chart-box{display:grid;grid-template-columns:repeat(7, 1fr);gap:6px;height:120px;align-items:flex-end;padding-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.st-col{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.st-bar-wrap{width:100%;max-width:20px;height:70px;background:var(--surface-2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.st-bar{width:100%;background:var(--accent);border-radius:6px}
.st-col.is-today .st-bar{background:var(--good)}

/* Interactive Map UI */
.map-controls{display:flex;flex-direction:column;gap:10px}
.map-search input{width:100%;height:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg)}
.map-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.map-tab{white-space:nowrap;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.map-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.map-chips{display:flex;flex-wrap:wrap;gap:8px}
.map-chip{display:inline-flex;flex-direction:column;padding:6px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.map-chip.mastered{border-color:var(--good);background:var(--good-bg)}
.chip-txt{font:700 14px var(--font-en)}
.chip-ph{font:500 10px var(--font-en);color:var(--muted)}

.menu-drawer{position:fixed;top:60px;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:35;display:none;flex-direction:column;gap:4px;width:200px}
.menu-drawer.open{display:flex}
.mitem{padding:10px;border-radius:8px;text-align:start;font-weight:700;font-size:14px}
.mitem:hover{background:var(--surface-2)}
</style>
</head>

<body>
<div id="app" dir="rtl">
  <header class="bar">
    <div class="bar-in">
      <button class="ibtn" id="btnTheme">🌙</button>
      <div class="title">Enotes</div>
      <button class="ibtn" id="btnMenu">☰</button>
    </div>
  </header>

  <div class="menu-drawer" id="menuDrawer">
    <button class="mitem" onclick="openSheet('stats')">📊 الإحصائيات والإنجاز</button>
    <button class="mitem" onclick="openSheet('map')">🗺️ خريطة الكلمات</button>
  </div>

  <main class="wrap">
    <div class="tabs">
      <button class="tab" aria-selected="true" onclick="setTab('words')">كلماتي (<span id="nWords">0</span>)</button>
      <button class="tab" aria-selected="false" onclick="setTab('idioms')">Idioms (<span id="nIdioms">0</span>)</button>
    </div>

    <section class="card">
      <h2>📝 إضافة كلمة أو تعبير</h2>
      <textarea id="noteInput" placeholder="اكتب الكلمة الترجمة أو المثال هنا..."></textarea>
      <button class="save" onclick="addNote()">حفظ المفردة</button>
    </section>

    <ul id="list"></ul>
  </main>

  <div class="scrim" id="scrim" hidden onclick="closeSheet()"></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="ibtn" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<script>
var items = JSON.parse(localStorage.getItem('wb_items') || '[]');
var theme = 'dark';
var currentTab = 'words';

function saveItems() {
  localStorage.setItem('wb_items', JSON.stringify(items));
  renderList();
}

function addNote() {
  var txt = document.getElementById('noteInput').value.trim();
  if(!txt) return;
  var parts = txt.split('\n');
  var en = parts[0] || '';
  var ar = parts[1] || 'مفردة جديدة';
  
  items.unshift({
    id: 'i' + Date.now(),
    en: en,
    ar: ar,
    type: currentTab === 'words' ? 'word' : 'idiom',
    cat: 'عام',
    ts: Date.now(),
    mastered: false
  });
  
  document.getElementById('noteInput').value = '';
  saveItems();
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach((b, i) => {
    b.setAttribute('aria-selected', (i === 0 && t === 'words') || (i === 1 && t === 'idioms'));
  });
  renderList();
}

function renderList() {
  var list = document.getElementById('list');
  var filtered = items.filter(i => (currentTab === 'words' ? i.type === 'word' : i.type === 'idiom'));
  
  document.getElementById('nWords').textContent = items.filter(i => i.type === 'word').length;
  document.getElementById('nIdioms').textContent = items.filter(i => i.type === 'idiom').length;

  if(!filtered.length) {
    list.innerHTML = '<li style="text-align:center;padding:20px;color:var(--muted)">لا توجد كلمات أضيفت بعد.</li>';
    return;
  }

  list.innerHTML = filtered.map(i => `
    <li class="item">
      <div>
        <div class="en">${i.en}</div>
        <div class="ar">${i.ar}</div>
      </div>
      <button onclick="toggleMastered('${i.id}')" style="font-size:18px">${i.mastered ? '✅' : '⚪'}</button>
    </li>
  `).join('');
}

function toggleMastered(id) {
  var item = items.find(i => i.id === id);
  if(item) { item.mastered = !item.mastered; saveItems(); }
}

/* Sheets Management */
function openSheet(name) {
  document.getElementById('menuDrawer').classList.remove('open');
  document.getElementById('sheet').hidden = false;
  document.getElementById('scrim').hidden = false;
  
  var body = document.getElementById('sheetBody');
  if(name === 'stats') {
    document.getElementById('sheetTitle').textContent = '📊 الإحصائيات والإنجازات';
    body.innerHTML = renderStats();
  } else if(name === 'map') {
    document.getElementById('sheetTitle').textContent = '🗺️ خريطة الكلمات التفاعلية';
    body.innerHTML = renderMap();
  }
}

function closeSheet() {
  document.getElementById('sheet').hidden = true;
  document.getElementById('scrim').hidden = true;
}

/* Features Logics */
function renderStats() {
  var total = items.length;
  var masteredCount = items.filter(i => i.mastered).length;
  var level = total < 10 ? 'A1 (مبتدئ)' : total < 30 ? 'A2 (أساسي)' : total < 60 ? 'B1 (متوسط)' : 'B2 (متقدم)';
  var levelPct = Math.min(100, Math.round((total / 60) * 100));

  return `
    <div class="st-streak-card">
      <div class="st-streak-info">
        <h3>🔥 التتابع اليومي الملتزم</h3>
        <p>أنت مستمر بالحفظ والتطبيق بنجاح!</p>
      </div>
      <div class="st-streak-badge">3 أيام</div>
    </div>

    <div class="st-level-box">
      <div class="st-level-head">
        <span>المستوى التقديري: <b>${level}</b></span>
        <span>${total} / 60 كلمة</span>
      </div>
      <div class="st-level-bar"><div class="st-level-fill" style="width:${levelPct}%"></div></div>
    </div>

    <div class="sec-t">🏆 الأوسمة المكتسبة</div>
    <div class="st-badges-grid">
      <div class="badge-item ${total >= 1 ? 'unlocked' : ''}">
        <span class="badge-icon">🌱</span>
        <span class="badge-title">البداية</span>
      </div>
      <div class="badge-item ${total >= 10 ? 'unlocked' : ''}">
        <span class="badge-icon">🔥</span>
        <span class="badge-title">المثابر</span>
      </div>
      <div class="badge-item ${masteredCount >= 5 ? 'unlocked' : ''}">
        <span class="badge-icon">👑</span>
        <span class="badge-title">المتقن</span>
      </div>
    </div>

    <div class="sec-t">📊 الإضافة الأسبوعية</div>
    <div class="st-chart-box">
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:30%"></div></div><span>السبت</span></div>
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:50%"></div></div><span>الأحد</span></div>
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:20%"></div></div><span>الإثنين</span></div>
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:70%"></div></div><span>الثلاثاء</span></div>
      <div class="st-col is-today"><div class="st-bar-wrap"><div class="st-bar" style="height:90%"></div></div><span>اليوم</span></div>
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:0%"></div></div><span>الخميس</span></div>
      <div class="st-col"><div class="st-bar-wrap"><div class="st-bar" style="height:0%"></div></div><span>الجمعة</span></div>
    </div>
  `;
}

function renderMap() {
  if(!items.length) return '<div style="text-align:center;padding:20px;color:var(--muted)">أضف كلمات لتستكشف الخريطة.</div>';

  var chips = items.map(i => `
    <div class="map-chip ${i.mastered ? 'mastered' : ''}">
      <span class="chip-txt">${i.en}</span>
      <span class="chip-ph">${i.ar}</span>
    </div>
  `).join('');

  return `
    <div class="map-controls">
      <div class="map-search"><input type="text" id="mSearch" placeholder="🔍 فلترة الخريطة..." oninput="filterMap()"></div>
    </div>
    <div class="map-chips" id="mapChips" style="margin-top:10px">${chips}</div>
  `;
}

function filterMap() {
  var q = document.getElementById('mSearch').value.toLowerCase();
  document.querySelectorAll('.map-chip').forEach(c => {
    var txt = c.querySelector('.chip-txt').textContent.toLowerCase();
    c.style.display = txt.includes(q) ? 'inline-flex' : 'none';
  });
}

document.getElementById('btnMenu').onclick = () => document.getElementById('menuDrawer').classList.toggle('open');
document.getElementById('btnTheme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
};

renderList();
</script>
</body>
</html>
