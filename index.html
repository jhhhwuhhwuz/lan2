<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الكلمات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دفتر الكلمات اليومي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: fixed top bar (search / theme on the left, menu on the right), one 640px column: tabs, new-sheet card, saved list. Tools open as bottom sheets. */
:root{
  --bg:#0b1020;
  --bar:rgba(11,16,32,.84);
  --surface:#121a2e;
  --surface-2:#18223a;
  --line:#243050;
  --fg:#e8eefc;
  --muted:#8e9bba;
  --accent:#5ea6ff;
  --accent-ink:#06142b;
  --accent-soft:rgba(94,166,255,.14);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --overlay:rgba(4,8,18,.62);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --font-ui:'Tajawal','Bricolage Grotesque',system-ui,sans-serif;
  --font-en:'Bricolage Grotesque','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eff3fb;
  --bar:rgba(239,243,251,.88);
  --surface:#ffffff;
  --surface-2:#f2f5fc;
  --line:#d8e0f1;
  --fg:#0e1a33;
  --muted:#5b6988;
  --accent:#1c6ee0;
  --accent-ink:#ffffff;
  --accent-soft:rgba(28,110,224,.1);
  --good:#12805a;
  --good-bg:rgba(18,128,90,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(14,26,51,.38);
  --shadow:0 14px 32px rgba(20,40,90,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-ui);-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.row:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0}

/* press animation */
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
.tap{animation:press .2s ease-out}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{position:relative;height:56px;max-width:640px;margin:0 auto;padding-inline:16px;display:flex;align-items:center}
.left{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden;transition:background .2s,border-color .2s,width .3s cubic-bezier(.2,.8,.2,1),opacity .2s,margin .3s}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg,.snd svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd{color:var(--accent)}
.snd svg{width:18px;height:18px}
#btnSearch{margin-right:8px}
.bar.searching #btnSearch{background:var(--accent-soft);border-color:var(--accent)}
.bar.searching #btnTheme{width:0;opacity:0;border-width:0;pointer-events:none}
.sfield{flex:0 0 0;min-width:0;opacity:0;overflow:hidden;display:flex;align-items:center;gap:8px;pointer-events:none;transition:flex-grow .32s cubic-bezier(.2,.8,.2,1),opacity .22s}
.bar.searching .sfield{flex:1 1 0;opacity:1;pointer-events:auto}
.pill{flex:1;min-width:0;height:40px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;transition:border-color .2s}
.pill:focus-within{border-color:var(--accent)}
.pill input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--font-ui)}
.pill input::placeholder{color:var(--muted)}
.title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-weight:800;font-size:17px;letter-spacing:.2px;transition:opacity .2s}
.title b{color:var(--accent);font-family:var(--font-en);font-size:19px}
.bar.searching .title{opacity:0}
.menu-anchor{position:relative;z-index:2;flex:none;margin-left:8px}
#btnMenu{font-size:20px}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:min(268px,calc(100vw - 32px));direction:rtl;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);transform-origin:calc(100% - 20px) 0;opacity:0;visibility:hidden;transform:translateY(-12px) scale(.94);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.25,1.08),visibility 0s .28s}
.menu.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu::before{content:'';position:absolute;top:-6px;right:14px;width:11px;height:11px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu.open .mitem{animation:rise .3s both}
.menu.open .mitem:nth-child(1){animation-delay:.04s}
.menu.open .mitem:nth-child(2){animation-delay:.08s}
.menu.open .mitem:nth-child(3){animation-delay:.12s}
.menu.open .mitem:nth-child(4){animation-delay:.16s}
.mitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:11px;text-align:start;font-weight:500;font-size:15px;transition:background .15s}
.mitem:hover,.mitem:focus-visible{background:var(--surface-2)}
.mitem .e{width:26px;text-align:center;font-size:20px}

/* page */
.wrap{max-width:640px;margin:0 auto;padding:72px 16px 48px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .lat{font-family:var(--font-en)}
.tab .n{font:700 12px var(--font-en);padding:1px 8px;border-radius:99px;background:rgba(127,127,127,.22);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:16px;font-weight:800}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mini{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.mini button{height:30px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:99px;font-size:13.5px;font-weight:800;color:var(--accent);opacity:.6;transition:background .2s,opacity .2s,transform .12s}
.mini button>span{display:block;transform:translateY(1px)}
.mini button:active{transform:scale(.94)}
.mini button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
textarea{display:block;width:100%;min-height:104px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 16px/1.6 var(--font-en)}
textarea{unicode-bidi:plaintext}
textarea::placeholder{color:var(--muted)}
.ff{display:flex;flex-direction:column;gap:12px}
.ff label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ff input{display:block;width:100%;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg);font:500 16px/1.4 var(--font-ui)}
.ff input::placeholder{color:var(--muted)}
.ff input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ff textarea{min-height:76px}
.ver{text-align:center;font:600 12px var(--font-en);color:var(--muted);direction:ltr;padding:4px 0 0;opacity:.8}
.foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.hint{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--muted)}
.hint.err{color:var(--bad)}
.hint code{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;color:var(--fg)}
.save{flex:none;height:42px;padding-inline:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}

/* list */
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.item.open{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.en{flex:0 1 auto;min-width:0;max-width:46%;direction:ltr;unicode-bidi:isolate;font:700 17px var(--font-en);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}
.cat{flex:none;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .detail{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0}
.detail-pad{display:flex;flex-direction:column;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-word{direction:ltr;unicode-bidi:isolate;font:800 24px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere;min-width:0}
.d-play{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:36px;padding-inline:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:2px}
.val{overflow-wrap:anywhere}
.val.note{padding:10px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-en)}
.nl{white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;line-height:1.8}
.nl.sp{height:.6em}
.val.ph{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-en)}
.val.none{color:var(--muted)}
.nedit{display:flex;flex-direction:column;gap:8px}
.ne-ph{width:100%;height:42px;padding-inline:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-en)}
.ne-ph::placeholder{color:var(--muted)}
.ne-ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.sm{height:38px;padding-inline:16px}
.menu.open .mitem:nth-child(5){animation-delay:.2s}
.menu.open .mitem:nth-child(6){animation-delay:.24s}
.menu.open .mitem:nth-child(7){animation-delay:.28s}
.menu.open .mitem:nth-child(8){animation-delay:.32s}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#ffffff;color:#1f1f1f;border:1px solid #dadce0}
.gbtn svg{width:20px;height:20px;flex:none}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html{overscroll-behavior:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.exnote{font-size:12px;color:var(--muted)}
.del{align-self:flex-start;height:36px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);color:var(--bad);font-size:13px;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.catedit{display:flex;flex-direction:column;align-items:flex-start}
.catopts{display:flex;flex-wrap:wrap;gap:6px}
.copt{height:34px;padding-inline:14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700}
.copt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.m-cat{color:var(--fg);font-weight:700}

#btnSearch svg{grid-area:1/1;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
#btnSearch .i-x{opacity:0;transform:rotate(-90deg) scale(.5)}
.bar.searching #btnSearch .i-search{opacity:0;transform:rotate(90deg) scale(.5)}
.bar.searching #btnSearch .i-x{opacity:1;transform:none}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* flashcards */
.fc-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.fc-scene{perspective:1100px}
.fc-scene.slide{animation:fcin .28s ease-out}
@keyframes fcin{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.fc-card{position:relative;height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.8,.2,1)}
.fc-card.noanim{transition:none}
.fc-scene.flipped .fc-card{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-back{transform:rotateY(180deg);border-color:var(--accent)}
.fc-c{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0;width:100%}
.fc-word{direction:ltr;unicode-bidi:isolate;font:800 34px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.fc-sm{direction:ltr;unicode-bidi:isolate;font:700 15px var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.fc-ar{font-size:26px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.fc-tip{font-size:12px;color:var(--muted)}
.fc-info{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.fc-info .val.note{width:100%;text-align:start}
.fc-snd{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%}
.fc-ctl{display:flex;gap:8px}
.fbtn{flex:none;height:40px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fbtn.main{flex:1;min-width:0;background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fbtn:disabled{opacity:.4;cursor:default}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translate(-50%,102%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:18px;font-weight:800}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,138,43,.16),rgba(255,138,43,.04));border:1px solid rgba(255,138,43,.35);border-radius:16px;padding:14px}
.streak .fire{font-size:40px;line-height:1;filter:drop-shadow(0 2px 8px rgba(255,120,30,.45))}
.streak .fire.off{filter:grayscale(1) opacity(.5);animation:none}
.streak .sn b{font:800 30px/1 var(--font-en);color:#ff9a3c}
.streak .sn span{font-size:13px;color:var(--muted);margin-inline-start:6px}
.streak .sm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.sdots{display:flex;gap:5px;margin-top:8px}
.sdots i{width:20px;height:20px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font:700 10px/18px var(--font-en);text-align:center;color:var(--muted);font-style:normal}
.sdots i.on{background:#ff9a3c;border-color:#ff9a3c;color:#2a1300}
.alertc{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.4);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alertc h4{font-size:15px;font-weight:800;margin:0}
.alertc p{font-size:13.5px;line-height:1.7;color:var(--fg);margin:0}
.stale{flex:none;font-size:11px;font-weight:700;color:#eab308;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.35);padding:1px 8px;border-radius:99px;white-space:nowrap}
.mbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.mbar i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.lgd span{display:inline-flex;align-items:center;gap:4px}
.lgd i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mtabs{align-self:flex-start}
#gcv{display:block;width:100%;height:380px;touch-action:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:grab}
.ginfo{min-height:44px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.ginfo .g-en{font:800 16px var(--font-en);color:var(--accent);direction:ltr;display:inline-block}
.ftree{margin:0;padding:0;list-style:none}
.ftree ul{list-style:none;margin:2px 0 0;padding-inline-start:18px;border-inline-start:2px solid var(--line)}
.ftree li{padding:3px 0 3px 0;position:relative}
.fnode{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font:700 14px var(--font-en);direction:ltr;cursor:pointer}
.fnode i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fnode small{font:500 12px var(--font-ui);color:var(--muted);direction:rtl}
.lk-w{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px;flex-wrap:wrap}
.lk-w b{font:800 20px var(--font-en);color:var(--accent);direction:ltr}
.lk-w span{color:var(--muted);font-weight:800}
.lk-m{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font:800 28px/1.1 var(--font-en);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:128px;padding:12px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.col{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.col .v{font:700 11px var(--font-en);color:var(--muted);height:14px}
.col .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px}
.col .b.z{background:var(--line)}
.col .d{max-width:100%;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.catrow .nm{flex:0 0 76px;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .tr{flex:1;min-width:0;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}

.catrow .ct{flex:none;width:24px;text-align:end;font:700 12px var(--font-en);color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.group h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.group h3 span{color:var(--muted);font:700 12px var(--font-en)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{max-width:100%;direction:ltr;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:700 14px var(--font-en);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.q-word{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.q-word b{direction:ltr;unicode-bidi:isolate;font:800 30px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere;text-align:center;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:start;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;overflow-wrap:anywhere}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.btn-main{align-self:stretch;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.result{text-align:center;padding:24px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.result b{display:block;font:800 44px/1.1 var(--font-en)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{height:40px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sbtn small{font-size:11px;font-weight:500;color:var(--muted)}
select{width:100%;height:44px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-en)}
.ipa{width:100%;border-collapse:collapse;font-size:13px}
.ipa td,.ipa th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.ipa th{color:var(--muted);font-weight:500}
.ipa .l{direction:ltr;unicode-bidi:isolate;font-family:var(--font-en)}
.tbl{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:opacity .2s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var root=document.documentElement;
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:d},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var DAY=86400000;
var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var SPK='<svg viewBox="-0.75 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
var CATS=['اسم','فعل','صفة','ضمير','حرف جر','ظرف/حال','روابط'];
var ICATS=['رسمية','غير رسمية'];
function catsFor(t){return t==='idiom'?ICATS:CATS}
var LANGS={'en-US':'أمريكية','en-GB':'بريطانية','en-AU':'أسترالية'};

/* ---------- data ---------- */
var seed=[
  ['serendipity','صدفة سعيدة','اسم','Finding that old letter was pure serendipity.','word','/ˌserənˈdɪpəti/'],
  ['resilient','مرن وقادر على التعافي','صفة','Children are often more resilient than we expect.','word','/rɪˈzɪliənt/'],
  ['procrastinate','يماطل ويؤجّل','فعل','Stop procrastinating and start the report.','word','/prəˈkræstɪneɪt/'],
  ['meticulous','دقيق جدًا في التفاصيل','صفة','She is meticulous about her notes.','word','/məˈtɪkjələs/'],
  ['ubiquitous','منتشر في كل مكان','صفة','Smartphones are ubiquitous now.','word','/juːˈbɪkwɪtəs/'],
  ['nevertheless','مع ذلك','ظرف/حال','It was raining. Nevertheless, we went out.','word','/ˌnevəðəˈles/'],
  ['reconcile','يوفّق بين طرفين متعارضين ويُصلح بينهما حتى يعود الوئام كما كان','فعل','They finally reconciled after years apart.','word','/ˈrekənsaɪl/'],
  ['break the ice','كسر الجمود في بداية اللقاء','غير رسمية','A joke is a good way to break the ice.','idiom'],
  ['piece of cake','شيء سهل جدًا','غير رسمية','The exam was a piece of cake.','idiom'],
  ['under the weather','متوعك قليلًا','غير رسمية','I am feeling a bit under the weather.','idiom'],
  ['once in a blue moon','نادرًا جدًا','غير رسمية','We meet once in a blue moon.','idiom'],
  ['hit the nail on the head','أصاب كبد الحقيقة','غير رسمية','You hit the nail on the head with that answer.','idiom']
];
var t0=Date.now();
/* استيراد تلقائي لكلمات النسخة السابقة من نفس المتصفح. للقراءة فقط، ولا يُعدَّل أو يُحذف أي مفتاح قديم. */
function legacyImport(){
  var LAT=/[A-Za-z]/,ARB=/[؀-ۿ]/,seq=0,found=[];
  function mapList(arr,keyName){
    var out=[],idiomKey=/idiom/i.test(keyName),base=Date.now();
    arr.forEach(function(o,idx){
      if(!o||typeof o!=='object'||Array.isArray(o))return;
      var strs=[];
      Object.keys(o).forEach(function(f){if(typeof o[f]==='string'&&o[f].trim())strs.push([f.toLowerCase(),o[f].trim()])});
      function pick(names,test,fallback){
        for(var n=0;n<names.length;n++)for(var j=0;j<strs.length;j++)if(strs[j][0]===names[n]&&(!test||test(strs[j][1])))return strs[j][1];
        if(fallback)for(var q=0;q<strs.length;q++)if(test(strs[q][1]))return strs[q][1];
        return '';
      }
      var en=pick(['en','english','word','term','eng','front','text','name'],function(x){return LAT.test(x)&&!ARB.test(x)},true);
      var ar=pick(['ar','arabic','meaning','mean','translation','def','definition','back'],function(x){return ARB.test(x)},true);
      if(!en||!ar)return;
      var kind=String(o.type||o.kind||o.tab||o.section||'');
      var cat=o.cat!==undefined?o.cat:(o.category!==undefined?o.category:(o.pos!==undefined?o.pos:o['تصنيف']));
      if(Array.isArray(cat))cat=cat[0];
      if(typeof cat!=='string'||!cat.trim()||/^(word|words|idiom|idioms)$/i.test(cat.trim()))cat='عام';
      var notes=pick(['notes','note','example','examples','ex','sentence','desc','description','details'],null,false);
      var ph=pick(['ph','phonetic','phonetics','ipa','pron','pronunciation'],null,false);
      var ts=NaN;
      ['ts','time','created','createdat','added','addedat','date','timestamp'].some(function(f){
        var key=Object.keys(o).filter(function(k){return k.toLowerCase()===f})[0];
        if(key===undefined)return false;
        var v=o[key];
        if(typeof v==='number'&&v>1e11){ts=v;return true}
        if(typeof v==='string'&&!isNaN(Date.parse(v))){ts=Date.parse(v);return true}
        return false;
      });
      if(isNaN(ts))ts=base-idx*1000;
      out.push({id:'m'+(seq++).toString(36)+base.toString(36),en:en,ar:ar,cat:cat.trim(),notes:notes,ph:ph,type:(idiomKey||/idiom/i.test(kind))?'idiom':'word',ts:ts,ex:false});
    });
    return out;
  }
  try{
    for(var k=0;k<localStorage.length;k++){
      var key=localStorage.key(k);
      if(!key||key.indexOf('wb.')===0)continue;
      var v;
      try{v=JSON.parse(localStorage.getItem(key))}catch(e){continue}
      if(Array.isArray(v))found=found.concat(mapList(v,key));
      else if(v&&typeof v==='object')Object.keys(v).forEach(function(kk){if(Array.isArray(v[kk]))found=found.concat(mapList(v[kk],key+'.'+kk))});
    }
  }catch(e){}
  var seen={};
  return found.filter(function(i){var d=i.type+'|'+i.en.toLowerCase();if(seen[d])return false;seen[d]=1;return true});
}
function seedItems(){return seed.map(function(s,i){return {id:'s'+i,en:s[0],ar:s[1],cat:s[2],notes:s[3],type:s[4],ph:s[5]||'',ts:t0-i*3600000,ex:true}})}
var items=store.get('wb.items',null),imported=0;
/* حماية: إذا وُجدت بيانات محفوظة لكن تعذّرت قراءتها، تُحفظ نسخة منها قبل أي كتابة جديدة. */
if(!Array.isArray(items)){
  try{var rawOld=localStorage.getItem('wb.items');if(rawOld)localStorage.setItem('wb.items.unreadable.'+Date.now(),rawOld)}catch(e){}
}
if(!Array.isArray(items)){
  var legacy=legacyImport();
  if(legacy.length){items=legacy;imported=legacy.length}
  else items=seedItems();
  store.set('wb.items',items);
}
items.forEach(function(i){if(i.ex&&i.type==='idiom'&&i.cat==='تعبير')i.cat='غير رسمية'});
var pref=store.get('wb.pref',{accent:'en-US',rate:1});
items.forEach(function(i){if(i.cat==='ظرف')i.cat='ظرف/حال'});
var tombs=store.get('wb.tombs',{}),dirty=store.get('wb.dirty',{});
var theme=store.get('wb.theme','dark');
var tab='words', query='', current=null, quiz=null, acSel='tomato', fc=null, revMode='cards';
function persist(){store.set('wb.items',items);store.set('wb.tombs',tombs);store.set('wb.dirty',dirty)}
function touch(it){it.upd=Date.now();if(!it.ex)dirty[it.id]=1;persist();syncSoon()}
function savePref(){store.set('wb.pref',pref)}
/* ---------- الاهتزاز ---------- */
var VIB={tap:10,err:[14,70,14],save:32,ok:[8,40,22]};
function hapticOn(){return pref.haptic!==false}
function hapticSupported(){return typeof navigator.vibrate==='function'}
function vib(k){
  if(!hapticOn()||!hapticSupported())return;
  try{navigator.vibrate(VIB[k||'tap'])}catch(e){}
}
document.addEventListener('click',function(e){
  if(e.target&&e.target.closest&&e.target.closest('button,[role="button"],[role="tab"],[role="menuitem"],.row,.chip,.fnode,a[href],label.sbtn'))vib('tap');
},true);

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){return new Date(ts).toISOString().slice(0,10)}}
function fmtDay(d){try{return d.toLocaleDateString('ar',{weekday:'short'})}catch(e){return String(d.getDate())}}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1900)}
function setInert(el,on){if(on)el.setAttribute('inert','');else el.removeAttribute('inert')}

function copyText(t){
  var done=function(){toast('تم النسخ')};
  var fb=function(){
    try{
      var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      ok?done():toast('تعذّر النسخ');
    }catch(e){toast('تعذّر النسخ')}
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}catch(e){fb()}
}

function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)){toast('هذا الجهاز لا يدعم النطق');return}
    var ss=window.speechSynthesis;ss.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang||pref.accent;
    var vs=ss.getVoices()||[];
    var norm=function(v){return v.lang.replace('_','-').toLowerCase()};
    var v=vs.filter(function(x){return norm(x)===u.lang.toLowerCase()})[0]||vs.filter(function(x){return norm(x).indexOf('en')===0})[0];
    if(v)u.voice=v;
    u.rate=pref.rate||1;
    ss.speak(u);
  }catch(e){toast('تعذّر تشغيل الصوت')}
}

/* ---------- theme ---------- */
function applyTheme(){
  root.setAttribute('data-theme',theme);
  $('#btnTheme').innerHTML=theme==='dark'?MOON:SUN;
}
$('#btnTheme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';store.set('wb.theme',theme);applyTheme()});
applyTheme();

/* ---------- press animation ---------- */
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest('button');if(!b)return;
  b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');
});
document.addEventListener('animationend',function(e){if(e.animationName==='press')e.target.classList.remove('tap')});

/* ---------- search ---------- */
var bar=$('#bar'),sfield=$('#sfield'),qIn=$('#q'),btnTheme=$('#btnTheme');
function openSearch(){
  closeMenu();
  bar.classList.add('searching');
  setInert(sfield,false);setInert(btnTheme,true);
  $('#btnSearch').setAttribute('aria-expanded','true');$('#btnSearch').setAttribute('aria-label','إغلاق البحث');
  setTimeout(function(){qIn.focus()},140);
}
function closeSearch(){
  bar.classList.remove('searching');
  setInert(sfield,true);setInert(btnTheme,false);
  $('#btnSearch').setAttribute('aria-expanded','false');$('#btnSearch').setAttribute('aria-label','بحث');
  qIn.value='';query='';qIn.blur();render();
}
$('#btnSearch').addEventListener('click',function(){bar.classList.contains('searching')?closeSearch():openSearch()});
qIn.addEventListener('input',function(){query=norm(qIn.value.trim());render()});

/* ---------- menu ---------- */
var menu=$('#menu'),btnMenu=$('#btnMenu');
function closeMenu(){menu.classList.remove('open');btnMenu.setAttribute('aria-expanded','false')}
btnMenu.addEventListener('click',function(e){
  e.stopPropagation();
  var open=!menu.classList.contains('open');
  menu.classList.toggle('open',open);
  btnMenu.setAttribute('aria-expanded',String(open));
});
document.addEventListener('click',function(e){if(!e.target.closest('.menu-anchor'))closeMenu()});
menu.addEventListener('click',function(e){
  var b=e.target.closest('[data-sheet]');if(!b)return;
  closeMenu();openSheet(b.dataset.sheet);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('#sheet').hidden)closeSheet();
  else if(menu.classList.contains('open'))closeMenu();
  else if(bar.classList.contains('searching'))closeSearch();
});

/* ---------- tabs ---------- */

var DIA=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/;
function normMap(str){
  var out='',map=[];
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i);
    if(DIA.test(c))continue;
    c=c.toLowerCase();
    if('\u0623\u0625\u0622\u0671'.indexOf(c)>-1)c='\u0627';
    else if(c==='\u0649')c='\u064A';
    for(var k=0;k<c.length;k++){out+=c.charAt(k);map.push(i)}
  }
  return {s:out,map:map};
}
function norm(str){return normMap(String(str)).s}
function hl(text){
  text=String(text);
  if(!query)return esc(text);
  var nm=normMap(text),ranges=[],from=0,idx;
  while((idx=nm.s.indexOf(query,from))>-1){
    var st=nm.map[idx],en=nm.map[idx+query.length-1]+1;
    while(en<text.length&&DIA.test(text.charAt(en)))en++;
    ranges.push([st,en]);from=idx+query.length;
  }
  if(!ranges.length)return esc(text);
  var out='',p=0;
  ranges.forEach(function(r){
    if(r[0]<p)r[0]=p;
    if(r[1]<=r[0])return;
    out+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1];
  });
  return out+esc(text.slice(p));
}
function noteHTML(text,h){
  return String(text).replace(/\r/g,'').split('\n').map(function(l){
    return l.trim()?'<div class="nl" dir="auto">'+(h?hl(l):esc(l))+'</div>':'<div class="nl sp"></div>';
  }).join('');
}

var AR=/[؀-ۿ]/,LAT=/[A-Za-z]/;
function trimSep(x){return x.replace(/^[\s\-–—=:|،,]+|[\s\-–—=:|،,]+$/g,'')}
/* كتابة حرة: أي نص يُقبل. السطر الأول هو الكلمة، والمعنى يؤخذ من نفس السطر أو من السطر التالي، والباقي ملاحظة. */
var FLAG=/\uD83C[\uDDE6-\uDDFF]\uD83C[\uDDE6-\uDDFF]/g;
var IPA=/[æðŋœɐ-˿θᴀ-ᶿ]/;
var PH_SRC='(\\/[^\\/\\n\\u0600-\\u06FF]{2,40}\\/|\\[[^\\]\\n\\u0600-\\u06FF]{2,40}\\])';
function findPh(str){
  var re=new RegExp(PH_SRC,'g'),m;
  while((m=re.exec(str))){if(IPA.test(m[1]))return m[1]}
  return '';
}
function cleanMeaning(x){return x.replace(/^(تعني|معناها|معنى|المعنى|يعني)\s*[:：\-–]\s*/,'').replace(/[.。]+$/,'').trim()}
function parseFree(text){
  var lines=text.replace(/\r/g,'').split('\n').map(function(x){return x.replace(/\s+$/,'')});
  var first=(lines.shift()||'').trim();
  var ph=findPh(first);
  if(ph)first=first.replace(ph,' ');
  first=first.replace(FLAG,' ').replace(/\s+/g,' ').trim();
  var en=first,ar='',raw='',ia=first.search(AR),il=first.search(LAT);
  if(ia>-1&&il>-1){
    if(il<ia){en=first.slice(0,ia);ar=first.slice(ia)}else{ar=first.slice(0,il);en=first.slice(il)}
    en=trimSep(en);ar=trimSep(ar);
  }else{
    for(var k=0;k<lines.length;k++)if(lines[k].trim()){raw=lines[k].trim();break}
    if(raw)ar=cleanMeaning(raw);
  }
  var notes=lines.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
  if(raw&&notes.trim()===raw)notes='';
  if(!ph&&en){
    var m2=new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'+PH_SRC).exec(text);
    if(m2&&IPA.test(m2[1]))ph=m2[1];
  }
  return {en:en,ar:ar,ph:ph,notes:notes};
}

var actDays=store.get('wb.days',{})||{};
function dk(d){var x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
function bump(){var k=dk(Date.now());if(!actDays[k]){actDays[k]=1;store.set('wb.days',actDays)}}
function activeSet(){var o={};Object.keys(actDays).forEach(function(k){o[k]=1});items.forEach(function(i){if(!i.ex)o[dk(i.ts)]=1});return o}
function dayNo(k){var p=k.split('-');return Math.round(new Date(+p[0],+p[1]-1,+p[2],12).getTime()/DAY)}
function streakInfo(){
  var act=activeSet(),today=new Date();today.setHours(12,0,0,0);
  var cur=new Date(today),doneToday=!!act[dk(cur)];
  if(!doneToday)cur.setDate(cur.getDate()-1);
  var c=0;while(act[dk(cur)]){c++;cur.setDate(cur.getDate()-1)}
  var nums=Object.keys(act).map(dayNo).sort(function(x,y){return x-y}),best=0,run=0;
  nums.forEach(function(n,i){run=(i&&n===nums[i-1]+1)?run+1:1;if(run>best)best=run});
  return {n:c,best:Math.max(best,c),today:doneToday,act:act};
}
function review(it,ok){
  if(!it)return;
  it.sn=Date.now();
  if(ok===true)it.lv=Math.min(5,(it.lv||0)+1);else if(ok===false)it.lv=Math.max(0,(it.lv||0)-1);
  if(it.ex)persist();else touch(it);
  bump();
}
var STALE_DAYS=5;
function staleDays(i){if(i.ex)return 0;var d=Math.floor((Date.now()-(i.sn||i.ts))/DAY);return d>=STALE_DAYS?d:0}
function staleList(){return items.filter(function(i){return staleDays(i)>0})}
function dWord(n){return n===1?'يوم':n===2?'يومان':n<=10?n+' أيام':n+' يومًا'}
var LVC=['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#15803d'];
var LVN=['جديدة','بداية','تتعرّف عليها','جيدة','قوية','متقنة'];
function lvColor(l){return LVC[Math.max(0,Math.min(5,l||0))]}
function statsView(){
  var words=items.filter(function(i){return i.type==='word'}).length,idioms=items.length-words;
  var real=items.filter(function(i){return !i.ex});
  var weekAgo=Date.now()-7*DAY;
  var week=real.filter(function(i){return i.ts>=weekAgo}).length;
  var days=[];
  for(var k=6;k>=0;k--){
    var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);
    var s=d.getTime(),e=s+DAY;
    days.push({d:d,n:real.filter(function(i){return i.ts>=s&&i.ts<e}).length});
  }
  var max=Math.max.apply(null,days.map(function(x){return x.n}).concat([1]));

    return '<div class="col"><span class="v">'+(x.n||'')+'</span><div class="b'+(x.n?'':' z')+'" style="height:'+(x.n?Math.max(6,Math.round(x.n/max*64)):3)+'px"></div><span class="d">'+esc(fmtDay(x.d))+'</span></div>';
  }).join('');

  }).join('')||'<div class="exnote">لا توجد بيانات بعد.</div>';
  /* التتابع اليومي */
  var si=streakInfo(),dots='';
  for(var q=6;q>=0;q--){var dd=new Date();dd.setDate(dd.getDate()-q);dots+='<i class="'+(si.act[dk(dd)]?'on':'')+'">'+['ح','ن','ث','ر','خ','ج','س'][dd.getDay()]+'</i>'}
  var streak='<div class="streak"><div class="fire'+(si.n?'':' off')+'">🔥</div><div style="min-width:0"><div class="sn"><b>'+si.n+'</b><span>'+(si.n===1?'يوم متتالي':'أيام متتالية')+'</span></div>'+
    '<div class="sm">'+(si.today?'ممتاز، أنجزت نشاط اليوم. أفضل تتابع لك: '+si.best:(si.n?'راجع أو أضف كلمة اليوم حتى لا ينقطع التتابع. أفضل تتابع لك: '+si.best:'ابدأ اليوم بإضافة كلمة أو مراجعتها لتبدأ التتابع.'))+'</div><div class="sdots">'+dots+'</div></div></div>';
  /* تنبيه النسيان */
  var st=staleList(),stq=st.filter(function(i){return i.ar}).length,alertc='';
  if(st.length)alertc='<div class="alertc"><h4>⚠️ مفردات تحتاج إعادتها</h4><p>لديك '+st.length+' '+(st.length>10?'كلمة':st.length===1?'كلمة':'كلمات')+' مرّ عليها '+STALE_DAYS+' أيام أو أكثر دون مراجعة أو اختبار. هل تود مراجعتها الآن؟</p>'+
    (stq>=1&&qItems().length>=2?'<button class="btn-main" data-act="staleq">ابدأ اختبارًا سريعًا ('+Math.min(stq,10)+')</button>':'')+'</div>';
  /* مستوى الحفظ */
  var cnt=[0,0,0,0,0,0];items.forEach(function(i){cnt[Math.max(0,Math.min(5,i.lv||0))]++});
  var tot=items.length||1;
  var mb='<div class="group"><div class="mbar">'+cnt.map(function(n,i){return n?'<i style="width:'+(n/tot*100)+'%;background:'+LVC[i]+'"></i>':''}).join('')+'</div>'+
    '<div class="lgd" style="margin-top:8px">'+cnt.map(function(n,i){return '<span><i style="background:'+LVC[i]+'"></i>'+LVN[i]+' '+n+'</span>'}).join('')+'</div></div>';
  return streak+alertc+
    '<div class="tiles"><div class="tile"><b>'+words+'</b><span>كلمة</span></div><div class="tile"><b>'+idioms+'</b><span>تعبير</span></div><div class="tile"><b>'+week+'</b><span>أضفتها هذا الأسبوع</span></div></div>'+
    '<div><div class="sec-t">مستوى الحفظ</div>'+mb+'</div>'+

function related(a,b){
  a=a.toLowerCase();b=b.toLowerCase();if(a===b)return false;
  var sh=a.length<=b.length?a:b,lo=sh===a?b:a;
  if(sh.length>=3&&lo.indexOf(sh)===0&&lo.length-sh.length>=2)return true;
  var cp=0;while(cp<sh.length&&sh.charAt(cp)===lo.charAt(cp))cp++;
  return cp>=5&&cp>=sh.length-3;
}
function famGroups(){
  var ws=items.filter(function(i){return i.type==='word'&&isSingle(i.en)});
  var par={};ws.forEach(function(w){par[w.id]=w.id});
  function f(x){while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x}
  for(var i=0;i<ws.length;i++)for(var j=i+1;j<ws.length;j++)if(related(ws[i].en,ws[j].en))par[f(ws[i].id)]=f(ws[j].id);
  var g={};ws.forEach(function(w){var r=f(w.id);(g[r]=g[r]||[]).push(w)});
  return {groups:Object.keys(g).map(function(k){return g[k]}).filter(function(a){return a.length>1}).map(function(a){return a.sort(function(x,y){return x.en.length-y.en.length||x.ts-y.ts})}),total:ws.length};
}

function initGraph(){
  var cv=$('#gcv');if(!cv)return;
  requestAnimationFrame(function(){
    if(!cv.isConnected)return;
    var w=cv.clientWidth||320,h=cv.clientHeight||380,dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=w*dpr;cv.height=h*dpr;
    var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    var cs=getComputedStyle(document.documentElement);
    var col={fg:cs.getPropertyValue('--fg').trim()||'#e8eefc',muted:cs.getPropertyValue('--muted').trim()||'#8e9bba',line:cs.getPropertyValue('--line').trim()||'#243050',accent:cs.getPropertyValue('--accent').trim()||'#5ea6ff',surface:cs.getPropertyValue('--surface').trim()||'#121a2e'};
    var ws=items.slice(0,120),cats=[],byId={};
    var nodes=ws.map(function(it,k){
      if(cats.indexOf(it.cat)<0)cats.push(it.cat);
      var n={it:it,x:w/2+(Math.random()-.5)*w*.6,y:h/2+(Math.random()-.5)*h*.6,vx:0,vy:0,r:14,fixed:false};byId[it.id]=n;return n;
    });
    var anc={};cats.forEach(function(c,i){var ang=i/cats.length*Math.PI*2;anc[c]={x:w/2+Math.cos(ang)*w*.28,y:h/2+Math.sin(ang)*h*.28}});
    var edges=[],seenE={};
    function addE(a,b,t,len,k){var key=a.it.id<b.it.id?a.it.id+'|'+b.it.id+t:b.it.id+'|'+a.it.id+t;if(seenE[key]||a===b)return;seenE[key]=1;edges.push({a:a,b:b,t:t,len:len,k:k})}
    var byCat={};nodes.forEach(function(n){(byCat[n.it.cat]=byCat[n.it.cat]||[]).push(n)});
    Object.keys(byCat).forEach(function(c){var g=byCat[c];for(var i=0;i<g.length;i++){if(g[i+1])addE(g[i],g[i+1],'c',70,.02);if(g[i+2])addE(g[i],g[i+2],'c',90,.01)}});
    for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){var A=nodes[i].it,B=nodes[j].it;if(A.type==='word'&&B.type==='word'&&isSingle(A.en)&&isSingle(B.en)&&related(A.en,B.en))addE(nodes[i],nodes[j],'f',50,.06)}
    bridges.forEach(function(b){if(byId[b[0]]&&byId[b[1]])addE(byId[b[0]],byId[b[1]],'b',80,.04)});
    G={cv:cv,nodes:nodes,edges:edges,alpha:1,run:false,drag:null,sel:gsel};
    function stepP(){
      var al=G.alpha;
      for(var i=0;i<nodes.length;i++){var a=nodes[i];
        for(var j=i+1;j<nodes.length;j++){var b=nodes[j];var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<1)d2=1;if(d2>25000)continue;var d=Math.sqrt(d2),f=1100/d2*al;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
        a.vx+=(w/2-a.x)*.0025*al;a.vy+=(h/2-a.y)*.0025*al;
        var an=anc[a.it.cat];if(an){a.vx+=(an.x-a.x)*.004*al;a.vy+=(an.y-a.y)*.004*al}
      }
      edges.forEach(function(e){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-e.len)*e.k*(.4+al*.6);dx/=d;dy/=d;e.a.vx+=dx*f;e.a.vy+=dy*f;e.b.vx-=dx*f;e.b.vy-=dy*f});
      nodes.forEach(function(n){if(n.fixed){n.vx=n.vy=0;return}n.vx*=.8;n.vy*=.8;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(n.r+4,Math.min(w-n.r-4,n.x));n.y=Math.max(n.r+14,Math.min(h-n.r-18,n.y))});

        else if(e.t==='f'){ctx.strokeStyle=col.accent;ctx.lineWidth=1.8}
        else{ctx.strokeStyle=col.line;ctx.lineWidth=1}
        ctx.stroke();
      });
      ctx.textAlign='center';ctx.font='600 11px "Bricolage Grotesque",system-ui,sans-serif';
      nodes.forEach(function(n){
        var sel=G.sel===n.it.id;
        if(staleDays(n.it)){ctx.beginPath();ctx.arc(n.x,n.y,n.r+5,0,7);ctx.setLineDash([3,3]);ctx.strokeStyle='#eab308';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([])}
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=lvColor(n.it.lv);ctx.fill();
        ctx.lineWidth=sel?3:2;ctx.strokeStyle=sel?col.fg:col.surface;ctx.stroke();

    }
    function loop(){

  });
}

function applyRemote(id,c){

  if(c.deleted){if(l)items=items.filter(function(x){return x.id!==id});tombs[id]=cu;return true}
  var n={id:id,en:c.en||'',ar:c.ar||'',ph:c.ph||'',cat:c.cat||'عام',notes:c.notes||'',type:c.type==='idiom'?'idiom':'word',ts:c.ts||cu,upd:cu,lv:c.lv||0,sn:c.sn||0,ex:false};

function dedupeKeys(){

function gfetch(url,o,txt){
  o=o||{};
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},25000);

  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).then(function(res){
    clearTimeout(timer);
    if(res.ok)return txt?res.text():res.json();
    return res.json().catch(function(){return {}}).then(function(j){

    });

  });
}

function syncNow(){

  return readRemote().then(function(doc){

    items.forEach(function(i){if(!i.ex&&!w[i.id])dirty[i.id]=1});

      '<tr><td class="l">tomato</td><td class="l">/təˈmeɪtoʊ/</td><td class="l">/təˈmɑːtəʊ/</td></tr>'+
      '<tr><td class="l">schedule</td><td class="l">/ˈskɛdʒuːl/</td><td class="l">/ˈʃɛdjuːl/</td></tr>'+
      '<tr><td class="l">water</td><td class="l">/ˈwɔːtɚ/</td><td class="l">/ˈwɔːtə/</td></tr></table></div></div>'+
    '<div class="exnote">يعتمد صوت كل لهجة على الأصوات المثبتة في جهازك. إن لم تتوفر لهجة، يُستخدم أقرب صوت إنجليزي.</div>';
}

sbody.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='fcCard'){e.preventDefault();fc.flipped=!fc.flipped;fcUpdate()}
});
sbody.addEventListener('change',function(e){
  if(e.target.id==='acWord')acSel=e.target.value;
  if(e.target.id==='impFile'&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();
    fr.onload=function(){importData(String(fr.result))};
    fr.onerror=function(){toast('تعذّرت قراءة الملف')};
    fr.readAsText(e.target.files[0]);
  }
});
sbody.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='chip')goTo(t.dataset.id);
  else if(a==='staleq'){
    var sp=shuffle(staleList().filter(function(i){return i.ar})).slice(0,10);
    if(sp.length){current='quiz';startQuiz(sp);renderSheet();sbody.scrollTop=0;$('#sheetTitle').textContent=TITLES.quiz}
  }
  else if(a==='mapmode'){mapMode=t.dataset.v;if(mapMode==='link')link=null;renderSheet()}
  else if(a==='linknew'){link=null;newPair();renderSheet()}
  else if(a==='linkshow'){mapMode='graph';gsel=link&&link.a.id;renderSheet()}
  else if(a==='linkopen'){
    var tx=($('#lkText').value||'').trim();link.text=tx;
    var nw=tx.split(/\s+/).filter(Boolean).length;
    if(nw<4)link.err='اكتب جملة كاملة من 4 كلمات على الأقل.';
    else if(!hasWord(tx,link.a.en)||!hasWord(tx,link.b.en))link.err='الجملة لازم تحتوي الكلمتين: '+link.a.en+' و '+link.b.en+'.';
    else{
      link.err='';link.ok=true;
      bridges.push([link.a.id,link.b.id,tx,Date.now()]);store.set('wb.bridges',bridges);
      review(link.a);review(link.b);toast('انفتح الجسر');
    }
    if(link.ok)vib('save');else vib('err');
    renderSheet();
  }
  else if(a==='opt'){
    if(quiz.picked!==null)return;
    var q=quiz.pool[quiz.i];quiz.picked=+t.dataset.i;
    var okq=quiz.opts[quiz.picked]===q.ar;if(okq)quiz.score++;
    review(q,okq);if(!okq)vib('err');
    if(link.err)vib('err');else vib('save');
    renderSheet();
  }
  else if(a==='next'){quiz.i++;if(quiz.i<quiz.pool.length)prepQ();renderSheet();sbody.scrollTop=0}
  else if(a==='fcflip'||a==='fcreveal'){fc.flipped=!fc.flipped;fcUpdate();if(fc.flipped)review(fcItem())}
  else if(a==='fcnext')fcGo(1);
  else if(a==='fcprev')fcGo(-1);
  else if(a==='fcshuffle'){fc.order=shuffle(fc.order);fcJump(0,0)}
  else if(a==='fcsay'){var fi=fcItem();if(fi)speak(fi.en)}
  else if(a==='signin')signIn();
  else if(a==='syncnow'){if(!tokenValid()){requestToken(false)}else{syncNow().then(function(){toast(cloud.err||'تمت المزامنة')})}}
  else if(a==='signout'){
    if(t.dataset.sure){doSignOut()}
    else{
      t.dataset.sure='1';t.textContent='اضغط للتأكيد';
      setTimeout(function(){if(t.isConnected){delete t.dataset.sure;t.textContent='تسجيل الخروج'}},3000);
    }
  }
  else if(a==='export'){
    try{
      var blob=new Blob([backupJSON()],{type:'application/json'});
      var url=URL.createObjectURL(blob),dl=document.createElement('a');
      dl.href=url;dl.download='words-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(dl);dl.click();document.body.removeChild(dl);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
      toast('جارٍ تنزيل النسخة الاحتياطية');
    }catch(err){toast('تعذّر التنزيل، استخدم نسخ البيانات')}
  }
  else if(a==='copyjson'){copyText(backupJSON())}
  else if(a==='import'){var it2=$('#impText');if(it2&&it2.value.trim())importData(it2.value);else toast('الصق البيانات أو اختر ملفًا أولًا')}
  else if(a==='restart'){startQuiz();renderSheet()}
  else if(a==='qsay')speak(quiz.pool[quiz.i].en);
  else if(a==='accent'){pref.accent=t.dataset.v;savePref();renderSheet();speak(acSel,pref.accent)}
  else if(a==='haptic'){pref.haptic=t.dataset.v==='1';savePref();renderSheet();vib('tap')}
  else if(a==='hapticTest'){vib('tap');setTimeout(function(){vib('err')},350);setTimeout(function(){vib('save')},900)}
  else if(a==='rate'){pref.rate=parseFloat(t.dataset.v);savePref();renderSheet()}
  else if(a==='try'){var s=$('#acWord');speak(s?s.value:acSel,t.dataset.v)}
});
try{if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=function(){if(current==='accent')renderSheet()}}catch(e){}

var installEv=null;

window.addEventListener('appinstalled',function(){installEv=null;$('#btnInstall').hidden=true;toast('تم تثبيت التطبيق')});

  closeMenu();
  if(!installEv)return;
  installEv.prompt();
  installEv.userChoice.then(function(){installEv=null;$('#btnInstall').hidden=true}).catch(function(){});
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
store.set('wb.schema',1);
initCloud();
window.addEventListener('online',syncSoon);
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncSoon()});
/* منع التكبير بالإصبعين أو بالضغط المزدوج أو بعجلة الفأرة */
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>-1)e.preventDefault()});
setPanel(store.get('wb.panel','free')==='form'?'form':'free');
setTab('words');
if(imported)setTimeout(function(){toast('تم استيراد '+imported+' من كلماتك السابقة')},700);
})();
